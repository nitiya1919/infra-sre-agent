{% extends 'dashboard/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4 p-4">
            <h3 class="text-center mb-4 fw-bold text-dark"><i class="bi bi-shield-lock text-primary"></i> SRE Portal Login</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <div class="text-center mt-3 text-muted small">Default Credentials: <b>admin</b> / <b>admin123</b></div>
        </div>
    </div>
</div>
{% endblock %}
